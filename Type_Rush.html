
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TypeRush | Typing Challenge</title>


<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@400;500;600;700&display=swap');

:root {
    --bg: #080707;
    --surface: #110e0d;
    --surface2: #1a1210;
    --red: #ff3828;
    --orange: #ff7135;
    --gold: #ffb347;
    --text: #f3e9e4;
    --muted: #907b73;
    --border: #39221d;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background:
        radial-gradient(ellipse at 50% 0%, #32120d 0%, transparent 42%),
        radial-gradient(ellipse at 0% 100%, #190b09 0%, transparent 40%),
        var(--bg);
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 30px;
    overflow-x: hidden;
}

/* BACKGROUND ATMOSPHERE */

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 3px,
        #ffffff02 4px
    );
    z-index: 0;
}

body::after {
    content: "";
    position: fixed;
    width: 400px;
    height: 400px;
    background: #ff3c1808;
    filter: blur(100px);
    bottom: -150px;
    right: -100px;
    pointer-events: none;
}

.container {
    width: 100%;
    max-width: 1050px;
    background: linear-gradient(145deg, #15100f, #0b0909 65%);
    border: 1px solid #42241c;
    position: relative;
    padding: 36px;
    box-shadow:
        0 0 50px #ff3b1508,
        0 25px 80px #00000080;
    z-index: 1;
}

/* CORNER DETAILS */

.container::before,
.container::after {
    content: "";
    position: absolute;
    width: 24px;
    height: 24px;
    border-color: var(--red);
    border-style: solid;
}

.container::before {
    top: -1px;
    left: -1px;
    border-width: 2px 0 0 2px;
}

.container::after {
    bottom: -1px;
    right: -1px;
    border-width: 0 2px 2px 0;
}

/* HEADER */

header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    margin-bottom: 36px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 24px;
}

.logo {
    font-family: 'Orbitron', sans-serif;
    font-size: 27px;
    font-weight: 900;
    letter-spacing: 3px;
    color: #f8eee9;
}

.logo span {
    color: var(--red);
    text-shadow: 0 0 20px #ff382860;
}

.tagline {
    font-family: 'Rajdhani', sans-serif;
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 8px;
}

.badge {
    border: 1px solid #712a1d;
    background: #230f0b;
    color: #ff6840;
    border-radius: 0;
    padding: 10px 14px;
    font-family: 'Orbitron', sans-serif;
    font-size: 10px;
    letter-spacing: 2px;
    white-space: nowrap;
    animation: pulse 2s infinite;
}

@keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 #ff442200; }
    50% { box-shadow: 0 0 15px #ff442225; }
}

/* SETTINGS */

.settings {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 25px;
}

select {
    background: #100c0b;
    color: #d9c3b9;
    border: 1px solid #482820;
    padding: 13px 16px;
    font-family: 'Rajdhani', sans-serif;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 1px;
    outline: none;
    cursor: pointer;
    border-radius: 0;
}

select:focus {
    border-color: var(--orange);
}

/* STATS HUD */

.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 22px;
}

.stat {
    background: linear-gradient(145deg, #1a100e, #100c0b);
    border: 1px solid #39221c;
    padding: 22px 12px;
    border-radius: 0;
    text-align: left;
    position: relative;
    overflow: hidden;
    transition: border-color .3s;
}

.stat:hover {
    border-color: #85402a;
}

.stat::after {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 3px;
    height: 100%;
    background: var(--red);
    opacity: .8;
}

.stat .label {
    color: #8d7167;
    font-family: 'Orbitron', sans-serif;
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 13px;
}

.stat .value {
    font-family: 'Orbitron', sans-serif;
    font-size: 29px;
    font-weight: 800;
    color: var(--orange);
    text-shadow: 0 0 15px #ff652018;
}

/* PROGRESS BAR */

.progress-wrap {
    height: 3px;
    background: #2b1915;
    border-radius: 0;
    margin-bottom: 28px;
    overflow: hidden;
}

.progress {
    width: 0%;
    height: 100%;
    background: linear-gradient(90deg, var(--red), var(--orange), var(--gold));
    border-radius: 0;
    transition: width .15s;
    box-shadow: 0 0 15px #ff4b28;
}

/* TYPING ARENA */

.panel {
    background: #0c0909;
    border: 1px solid #39221c;
    border-radius: 0;
    padding: 30px;
    position: relative;
}

.panel::before {
    content: "TRAINING ZONE // 01";
    position: absolute;
    top: -9px;
    left: 20px;
    background: #0c0909;
    color: #a34b32;
    padding: 0 10px;
    font-family: 'Orbitron', sans-serif;
    font-size: 9px;
    letter-spacing: 2px;
}

.panel-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 26px;
}

.panel-top h2 {
    font-family: 'Orbitron', sans-serif;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 1px;
    color: #d4b7a9;
}

#status {
    font-family: 'Orbitron', sans-serif;
    font-size: 10px;
    color: var(--orange);
    letter-spacing: 1px;
    text-align: right;
}

/* PASSAGE */

.text-display {
    font-family: 'Rajdhani', sans-serif;
    font-size: 23px;
    line-height: 2.1;
    letter-spacing: 1px;
    color: #57443e;
    word-break: break-word;
    margin-bottom: 28px;
    font-weight: 600;
}

.text-display span {
    border-radius: 0;
    transition: color .1s;
}

.text-display span.correct,
.text-display span.done {
    color: #ff895d;
}

.text-display span.current {
    color: #fff1e8;
    background: #5c2117;
    border-bottom: 2px solid #ff4b2d;
    box-shadow: 0 0 12px #ff421c25;
}

.text-display span.current.space {
    background: #402017;
}

.text-display span.error-flash {
    background: #ff3828;
    color: white;
    box-shadow: 0 0 15px #ff382860;
}

/* INPUT */

.input-box {
    width: 100%;
    min-height: 125px;
    resize: vertical;
    background: #130d0c;
    border: 1px solid #42261e;
    border-radius: 0;
    padding: 20px;
    color: #f1c2ad;
    font-family: 'Rajdhani', sans-serif;
    font-size: 17px;
    letter-spacing: 1px;
    line-height: 1.8;
    outline: none;
    caret-color: var(--orange);
    transition: .25s;
}

.input-box:focus {
    border-color: #a34329;
    box-shadow: inset 0 0 20px #ff441008, 0 0 12px #ff441010;
}

.input-box::placeholder {
    color: #694c42;
    letter-spacing: 1px;
}

.input-box:disabled {
    opacity: .45;
    cursor: not-allowed;
}

.tip {
    margin-top: 14px;
    font-size: 12px;
    color: #795d51;
    letter-spacing: 1px;
}

/* BUTTONS */

.controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-top: 25px;
}

.left-controls {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

button {
    padding: 13px 19px;
    border-radius: 0;
    border: 1px solid #49271e;
    background: #170e0c;
    color: #d6b8aa;
    cursor: pointer;
    font-family: 'Orbitron', sans-serif;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 1.5px;
    transition: .25s;
}

button:hover {
    transform: translateY(-2px);
    border-color: var(--orange);
    color: var(--orange);
    box-shadow: 0 0 15px #ff501615;
}

button:disabled {
    opacity: .35;
    cursor: not-allowed;
    transform: none;
}

.primary {
    background: linear-gradient(100deg, #d83320, #ff6932);
    border: 1px solid #ff6b3d;
    color: #fff4ec;
    box-shadow: 0 0 20px #ff4b281a;
}

.primary:hover {
    background: linear-gradient(100deg, #ff4b30, #ff8a42);
    color: #fff;
    border-color: #ff9a53;
    box-shadow: 0 0 25px #ff4b2835;
}

/* COUNTDOWN */

.countdown {
    display: none;
    font-family: 'Orbitron', sans-serif;
    font-size: 70px;
    font-weight: 900;
    color: var(--red);
    text-align: center;
    margin: 20px 0;
    text-shadow: 0 0 30px #ff382860;
    animation: pop .5s ease;
}

@keyframes pop {
    from {
        transform: scale(.5);
        opacity: 0;
    }
    to {
        transform: scale(1);
        opacity: 1;
    }
}

/* RESULT */

.result {
    display: none;
    margin-top: 25px;
    padding: 28px;
    background: linear-gradient(145deg, #1b100e, #100b0a);
    border: 1px solid #6c3020;
    border-radius: 0;
    text-align: center;
}

.result h2 {
    font-family: 'Orbitron', sans-serif;
    color: var(--orange);
    font-size: 18px;
    letter-spacing: 3px;
    margin-bottom: 12px;
}

.big-score {
    font-family: 'Orbitron', sans-serif;
    font-size: 48px;
    font-weight: 900;
    color: #ff6938;
    margin: 18px 0;
    text-shadow: 0 0 25px #ff552025;
}

.result p {
    line-height: 2;
    color: #b99c8d;
    letter-spacing: 1px;
}

.result strong {
    color: #ff9b58;
}

/* FOOTER */

.footer {
    margin-top: 24px;
    text-align: center;
    color: #65483d;
    font-family: 'Orbitron', sans-serif;
    font-size: 9px;
    letter-spacing: 3px;
    text-transform: uppercase;
}

/* RESPONSIVE */

@media(max-width:700px) {
    body {
        padding: 12px;
    }

    .container {
        padding: 22px 16px;
    }

    header {
        align-items: flex-start;
    }

    .logo {
        font-size: 22px;
    }

    .badge {
        font-size: 8px;
        letter-spacing: 1px;
    }

    .stats {
        grid-template-columns: repeat(2, 1fr);
    }

    .text-display {
        font-size: 19px;
    }

    .panel {
        padding: 22px 16px;
    }

    .controls {
        align-items: stretch;
    }

    .left-controls {
        width: 100%;
    }

    .controls > button {
        flex: 1;
    }
}
</style>

</head>

<body>

<div class="container">

    <header>
        <div>
            <div class="logo">TYPE<span>RUSH</span> ⚡</div>
            <div class="tagline">Test your speed. Train your reflexes.</div>
        </div>
        <div class="badge">● TYPING TEST</div>
    </header>

    <div class="settings">
        <select id="difficulty">
            <option value="easy">🟢 Easy</option>
            <option value="medium" selected>🟡 Medium</option>
            <option value="hard">🔴 Hard</option>
        </select>

        <select id="duration">
            <option value="30">⏱ 30 Seconds</option>
            <option value="60" selected>⏱ 60 Seconds</option>
            <option value="120">⏱ 120 Seconds</option>
        </select>
    </div>

    <div class="stats">
        <div class="stat">
            <div class="label">Time Left</div>
            <div class="value" id="time">60s</div>
        </div>

        <div class="stat">
            <div class="label">Speed</div>
            <div class="value" id="wpm">0</div>
        </div>

        <div class="stat">
            <div class="label">Accuracy</div>
            <div class="value" id="accuracy">100%</div>
        </div>

        <div class="stat">
            <div class="label">Errors</div>
            <div class="value" id="errors">0</div>
        </div>
    </div>

    <div class="progress-wrap">
        <div class="progress" id="progress"></div>
    </div>

    <div class="panel">

        <div class="panel-top">
            <h2>⌨️ Type the highlighted text</h2>
            <span id="status">Ready</span>
        </div>

        <div class="countdown" id="countdown"></div>

        <div class="text-display" id="textDisplay"></div>

        <textarea
            class="input-box"
            id="input"
            placeholder="Press Start Typing, wait for countdown, then type here..."
            spellcheck="false"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
            disabled
        ></textarea>

        <div class="tip">
            💡 Correct keys advance. Wrong keys count as errors. Backspace is allowed.
        </div>

    </div>

    <div class="controls">

        <div class="left-controls">
            <button id="soundBtn">🔊 Sound ON</button>
            <button id="restartBtn">↻ Restart</button>
        </div>

        <button class="primary" id="startBtn">⌨️ Start Typing</button>

    </div>

    <div class="result" id="result">
        <h2>🏁 Challenge Finished!</h2>
        <div class="big-score" id="finalWpm">0 WPM</div>
        <p id="resultDetails"></p>
        <br>
        <button class="primary" id="playAgainBtn">Play Again</button>
    </div>

    <div class="footer">
        Made for practice — not excuses. 😉
    </div>

</div>

<script>
// ---------------- PASSAGES ----------------

const passages = {
    easy: [
        "Practice makes progress. Keep typing every day and you will become faster and better. Stay focused and enjoy learning new things.",
        "Learning a new skill takes time. Be patient with yourself and keep trying. Every mistake is an opportunity to improve.",
        "Believe in yourself and never stop learning. Small steps every day can lead to amazing results."
    ],

    medium: [
        "Technology is changing the way people live, work, communicate, and learn. Curiosity helps us discover new ideas, while creativity helps us turn those ideas into useful solutions.",
        "Programming is not about memorizing everything. It is about understanding problems, breaking them into smaller pieces, and finding creative ways to solve them.",
        "Success comes from consistency, discipline, patience, and the courage to keep moving forward even when the journey becomes difficult."
    ],

    hard: [
        "Artificial intelligence, cybersecurity, automation, and computational thinking are transforming modern industries. Innovation requires curiosity, experimentation, adaptability, and a willingness to challenge conventional assumptions.",
        "A developer's responsibility extends beyond writing functional code; maintainability, accessibility, efficiency, security, and thoughtful architecture are equally important considerations.",
        "Complex problems rarely have straightforward solutions. Analytical reasoning, systematic experimentation, persistence, and collaboration are essential when navigating uncertain technical challenges."
    ]
};

// ---------------- VARIABLES ----------------

let passage = "";
let typedText = "";

let timeLeft = 60;
let totalTime = 60;

let correctCount = 0;
let errorCount = 0;

let gameStarted = false;
let countdownActive = false;
let gameOver = false;
let soundEnabled = true;

let timerInterval = null;
let countdownTimeout = null;

let audioContext = null;

// ---------------- ELEMENTS ----------------

const display = document.getElementById("textDisplay");
const input = document.getElementById("input");
const timeDisplay = document.getElementById("time");
const wpmDisplay = document.getElementById("wpm");
const accuracyDisplay = document.getElementById("accuracy");
const errorsDisplay = document.getElementById("errors");
const progressBar = document.getElementById("progress");
const statusDisplay = document.getElementById("status");
const countdownDisplay = document.getElementById("countdown");
const resultBox = document.getElementById("result");
const startBtn = document.getElementById("startBtn");

// ---------------- SOUND ENGINE ----------------

function playTone(frequency, duration = 60, type = "sine", volume = 0.04) {
    if (!soundEnabled) return;

    try {
        audioContext = audioContext || new (window.AudioContext || window.webkitAudioContext)();

        if (audioContext.state === "suspended") {
            audioContext.resume();
        }

        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();

        oscillator.type = type;
        oscillator.frequency.value = frequency;

        gain.gain.setValueAtTime(volume, audioContext.currentTime);
        gain.gain.exponentialRampToValueAtTime(
            0.001,
            audioContext.currentTime + duration / 1000
        );

        oscillator.connect(gain);
        gain.connect(audioContext.destination);

        oscillator.start();
        oscillator.stop(audioContext.currentTime + duration / 1000);
    } catch (e) {
        // Game still works if audio is unavailable.
    }
}

function keySound() {
    playTone(750 + Math.random() * 100, 35, "square", 0.012);
}

function errorSound() {
    playTone(180, 120, "sawtooth", 0.045);
}

function countdownSound() {
    playTone(550, 130, "sine", 0.04);
}

function finishSound() {
    playTone(523, 130, "sine", 0.05);
    setTimeout(() => playTone(659, 150, "sine", 0.05), 140);
    setTimeout(() => playTone(784, 220, "sine", 0.05), 300);
}

// ---------------- PASSAGE ----------------

function choosePassage() {
    const difficulty = document.getElementById("difficulty").value;
    const list = passages[difficulty];

    return list[Math.floor(Math.random() * list.length)];
}

function renderText() {
    display.innerHTML = "";

    [...passage].forEach((char, index) => {
        const span = document.createElement("span");
        span.textContent = char;
        span.dataset.index = index;

        if (index === 0) {
            span.classList.add("current");
        }

        if (char === " ") {
            span.classList.add("space");
        }

        display.appendChild(span);
    });
}

// ---------------- COUNTDOWN ----------------

function beginCountdown() {
    if (countdownActive || gameStarted || gameOver) return;

    countdownActive = true;
    input.disabled = true;
    startBtn.disabled = true;
    statusDisplay.textContent = "Get ready...";
    countdownDisplay.style.display = "block";

    let count = 3;

    function showCount() {
        if (gameOver) return;

        if (count > 0) {
            countdownDisplay.textContent = count;
            countdownSound();
            count--;

            countdownTimeout = setTimeout(showCount, 850);
        } else {
            countdownDisplay.textContent = "GO!";
            playTone(880, 200, "sine", 0.06);

            countdownTimeout = setTimeout(() => {
                countdownDisplay.style.display = "none";

                input.disabled = false;
                input.readOnly = false;
                input.focus();

                gameStarted = true;
                countdownActive = false;

                statusDisplay.textContent = "🔥 Go!";
                startTimer();
            }, 500);
        }
    }

    showCount();
}

// ---------------- TIMER ----------------

function startTimer() {
    timerInterval = setInterval(() => {
        timeLeft--;
        timeDisplay.textContent = timeLeft + "s";

        if (timeLeft <= 10) {
            timeDisplay.style.color = "#ff5277";
        }

        updateStats();

        if (timeLeft <= 0) {
            endGame("Time is up!");
        }
    }, 1000);
}

// ---------------- STATS ----------------

function getWPM() {
    const elapsed = totalTime - timeLeft;

    if (elapsed <= 0) return 0;

    return Math.round((correctCount / 5) / (elapsed / 60));
}

function getAccuracy() {
    const attempts = correctCount + errorCount;

    if (attempts === 0) return 100;

    return Math.round((correctCount / attempts) * 100);
}

function updateStats() {
    wpmDisplay.textContent = getWPM();
    accuracyDisplay.textContent = getAccuracy() + "%";
    errorsDisplay.textContent = errorCount;

    const percentage = (typedText.length / passage.length) * 100;
    progressBar.style.width = percentage + "%";
}

// ---------------- DISPLAY UPDATE ----------------

function updateCharacters() {
    const chars = display.querySelectorAll("span");

    chars.forEach((span, index) => {
        span.className = "";

        if (index < typedText.length) {
            span.classList.add("done");
        }

        if (index === typedText.length && !gameOver) {
            span.classList.add("current");

            if (passage[index] === " ") {
                span.classList.add("space");
            }
        }
    });
}

// ---------------- TYPING INPUT ----------------

input.addEventListener("input", function() {
    if (!gameStarted || gameOver) {
        input.value = typedText;
        return;
    }

    const newValue = input.value;

    // Backspace handling
    if (newValue.length < typedText.length) {
        typedText = newValue;
        correctCount = typedText.length;

        updateCharacters();
        updateStats();
        keySound();
        return;
    }

    // Process only newly added characters
    const addedText = newValue.slice(typedText.length);

    for (const char of addedText) {
        const expectedChar = passage[typedText.length];

        if (char === expectedChar) {
            typedText += char;
            correctCount++;
            keySound();
        } else {
            errorCount++;
            errorSound();
            statusDisplay.textContent = "❌ Wrong key!";

            const currentSpan = display.querySelector(
                `[data-index="${typedText.length}"]`
            );

            if (currentSpan) {
                currentSpan.classList.add("error-flash");

                setTimeout(() => {
                    currentSpan.classList.remove("error-flash");
                }, 180);
            }
        }

        if (typedText.length >= passage.length) {
            break;
        }
    }

    // Keep only accepted characters
    input.value = typedText;

    // Keep cursor at the end
    input.setSelectionRange(input.value.length, input.value.length);

    updateCharacters();
    updateStats();

    if (typedText.length === passage.length) {
        endGame("Passage completed!");
    } else if (!gameOver) {
        statusDisplay.textContent = "🔥 Go!";
    }
});

// ---------------- ANTI-CHEAT ----------------

input.addEventListener("paste", event => {
    event.preventDefault();
    statusDisplay.textContent = "🚫 Paste is disabled!";
    errorSound();
});

input.addEventListener("copy", event => event.preventDefault());
input.addEventListener("cut", event => event.preventDefault());

input.addEventListener("contextmenu", event => {
    event.preventDefault();
});

input.addEventListener("drop", event => {
    event.preventDefault();
});

input.addEventListener("dragover", event => {
    event.preventDefault();
});

input.addEventListener("keydown", function(event) {
    if ((event.ctrlKey || event.metaKey) &&
        ["v", "c", "x", "a"].includes(event.key.toLowerCase())) {
        event.preventDefault();

        if (event.key.toLowerCase() === "v") {
            statusDisplay.textContent = "🚫 Paste is disabled!";
            errorSound();
        }
    }

    if (event.key === "Tab") {
        event.preventDefault();
    }
});

// ---------------- END GAME ----------------

function endGame(message) {
    if (gameOver) return;

    gameOver = true;
    gameStarted = false;
    countdownActive = false;

    clearInterval(timerInterval);
    clearTimeout(countdownTimeout);

    input.disabled = true;
    startBtn.disabled = false;

    statusDisplay.textContent = "🏁 Finished";

    finishSound();

    const finalWPM = getWPM();
    const finalAccuracy = getAccuracy();

    let rating = "🌱 Beginner";

    if (finalWPM >= 80 && finalAccuracy >= 95) {
        rating = "⚡ Typing Legend";
    } else if (finalWPM >= 60 && finalAccuracy >= 90) {
        rating = "🔥 Typing Master";
    } else if (finalWPM >= 40 && finalAccuracy >= 85) {
        rating = "💎 Typing Pro";
    } else if (finalWPM >= 25) {
        rating = "✨ Improving";
    }

    document.getElementById("finalWpm").textContent = finalWPM + " WPM";

    document.getElementById("resultDetails").innerHTML = `
        <strong>${message}</strong><br><br>
        Accuracy: ${finalAccuracy}%<br>
        Correct characters: ${correctCount}<br>
        Wrong key presses: ${errorCount}<br><br>
        <strong>${rating}</strong>
    `;

    resultBox.style.display = "block";
}

// ---------------- RESTART ----------------

function restartGame() {
    clearInterval(timerInterval);
    clearTimeout(countdownTimeout);

    passage = choosePassage();
    typedText = "";

    totalTime = Number(document.getElementById("duration").value);
    timeLeft = totalTime;

    correctCount = 0;
    errorCount = 0;

    gameStarted = false;
    countdownActive = false;
    gameOver = false;

    input.disabled = true;
    input.readOnly = false;
    input.value = "";

    timeDisplay.textContent = timeLeft + "s";
    timeDisplay.style.color = "#42d9ff";

    wpmDisplay.textContent = "0";
    accuracyDisplay.textContent = "100%";
    errorsDisplay.textContent = "0";

    progressBar.style.width = "0%";

    statusDisplay.textContent = "Ready";
    countdownDisplay.style.display = "none";
    resultBox.style.display = "none";

    startBtn.disabled = false;
    startBtn.textContent = "⌨️ Start Typing";

    renderText();
}

// ---------------- BUTTONS ----------------

startBtn.addEventListener("click", () => {
    if (!gameStarted && !countdownActive && !gameOver) {
        beginCountdown();
    }
});

document.getElementById("restartBtn").addEventListener("click", restartGame);
document.getElementById("playAgainBtn").addEventListener("click", restartGame);

document.getElementById("soundBtn").addEventListener("click", function() {
    soundEnabled = !soundEnabled;
    this.textContent = soundEnabled ? "🔊 Sound ON" : "🔇 Sound OFF";

    if (soundEnabled) {
        playTone(700, 100, "sine", 0.04);
    }
});

document.getElementById("difficulty").addEventListener("change", restartGame);
document.getElementById("duration").addEventListener("change", restartGame);

// ---------------- INITIALIZE ----------------

restartGame();
</script>

</body>
</html>
