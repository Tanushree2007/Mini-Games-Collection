
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Snake</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #0a0a16;
        font-family: Arial, sans-serif;
        color: white;
    }

    .container {
        text-align: center;
        background: #151525;
        padding: 25px;
        border-radius: 20px;
        box-shadow: 0 0 30px #00f7ff33;
    }

    h1 {
        color: #00f7ff;
        text-shadow: 0 0 15px #00f7ff;
    }

    .score {
        font-size: 20px;
        margin: 15px;
    }

    canvas {
        background: #090912;
        border: 2px solid #00f7ff;
        box-shadow: 0 0 15px #00f7ff55;
        border-radius: 8px;
        max-width: 100%;
    }

    button {
        margin-top: 20px;
        padding: 12px 25px;
        border: none;
        border-radius: 10px;
        background: #00f7ff;
        color: #101020;
        font-weight: bold;
        font-size: 16px;
        cursor: pointer;
    }

    button:hover {
        background: white;
    }

    p {
        color: #aaa;
    }
</style>
</head>

<body>

<div class="container">
    <h1>🐍 NEON SNAKE</h1>

    <div class="score">
        Score: <span id="score">0</span>
    </div>

    <canvas id="canvas" width="400" height="400"></canvas>

    <p>Use Arrow Keys to move</p>
    <button onclick="restartGame()">Restart Game</button>
</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const scoreText = document.getElementById("score");

const box = 20;
const total = canvas.width / box;

let snake, food, direction, score, game;
let running = false;

function restartGame() {
    clearInterval(game);

    snake = [{ x: 10, y: 10 }];
    food = { x: 5, y: 5 };
    direction = "RIGHT";
    score = 0;

    scoreText.innerText = score;
    running = true;

    draw();
    game = setInterval(draw, 110);
}

document.addEventListener("keydown", function(e) {
    const keys = {
        ArrowUp: "UP",
        ArrowDown: "DOWN",
        ArrowLeft: "LEFT",
        ArrowRight: "RIGHT"
    };

    if (!keys[e.key]) return;
    e.preventDefault();

    const next = keys[e.key];

    if (next === "UP" && direction !== "DOWN")
        direction = "UP";

    if (next === "DOWN" && direction !== "UP")
        direction = "DOWN";

    if (next === "LEFT" && direction !== "RIGHT")
        direction = "LEFT";

    if (next === "RIGHT" && direction !== "LEFT")
        direction = "RIGHT";
});

function draw() {
    if (!running) return;

    ctx.fillStyle = "#090912";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Draw food
    ctx.fillStyle = "#ff2e63";
    ctx.shadowColor = "#ff2e63";
    ctx.shadowBlur = 15;
    ctx.fillRect(food.x * box, food.y * box, box, box);
    ctx.shadowBlur = 0;

    // Draw snake
    snake.forEach((part, index) => {
        ctx.fillStyle = index === 0 ? "#00f7ff" : "#00c9a7";
        ctx.shadowColor = "#00f7ff";
        ctx.shadowBlur = 10;
        ctx.fillRect(part.x * box, part.y * box, box - 2, box - 2);
    });

    ctx.shadowBlur = 0;

    let head = { ...snake[0] };

    if (direction === "UP") head.y--;
    if (direction === "DOWN") head.y++;
    if (direction === "LEFT") head.x--;
    if (direction === "RIGHT") head.x++;

    // Wall collision
    if (head.x < 0 || head.x >= total ||
        head.y < 0 || head.y >= total) {
        endGame();
        return;
    }

    // Self collision
    if (snake.some(part => part.x === head.x && part.y === head.y)) {
        endGame();
        return;
    }

    snake.unshift(head);

    // Eat food
    if (head.x === food.x && head.y === food.y) {
        score++;
        scoreText.innerText = score;
        food = randomFood();
    } else {
        snake.pop();
    }
}

function randomFood() {
    let newFood;

    do {
        newFood = {
            x: Math.floor(Math.random() * total),
            y: Math.floor(Math.random() * total)
        };
    } while (snake.some(part =>
        part.x === newFood.x && part.y === newFood.y
    ));

    return newFood;
}

function endGame() {
    running = false;
    clearInterval(game);

    setTimeout(() => {
        alert("Game Over! Your score: " + score);
    }, 100);
}

function drawStart() {
    ctx.fillStyle = "#090912";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#00f7ff";
    ctx.font = "22px Arial";
    ctx.textAlign = "center";
    ctx.fillText("Click Restart to Play!", 200, 200);
}

drawStart();
</script>

</body>
</html>
