<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MAZE RUNNER · deluxe</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            margin: 0;
            min-height: 100vh;
            background: radial-gradient(circle at 20% 30%, #1b2e4b, #08111e);
            font-family: 'Segoe UI', 'Courier New', monospace;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
        }
        .game-wrapper {
            background: #142433;
            border-radius: 32px;
            padding: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8), inset 0 0 0 2px #2d4d6e;
        }
        canvas {
            display: block;
            margin: 0 auto;
            border-radius: 20px;
            box-shadow: inset 0 0 0 3px #3e5f7a, 0 8px 20px #00000060;
            background: #0f1e2e;
            width: 100%;
            height: auto;
            touch-action: none;
        }
        .info-panel {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            margin-top: 16px;
            color: #e0f0ff;
            font-weight: bold;
            font-size: 1.2rem;
            gap: 12px;
            padding: 0 4px;
        }
        .stats {
            display: flex;
            gap: 16px;
            background: #0b1a2a;
            padding: 10px 20px;
            border-radius: 40px;
            box-shadow: inset 0 3px 8px #00000080, 0 4px 0 #0a1520;
        }
        .stat {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .stat span {
            color: #f5d742;
            margin-left: 4px;
            min-width: 24px;
            text-align: center;
        }
        .controls {
            display: flex;
            gap: 12px;
        }
        button {
            background: #2e4b66;
            border: none;
            color: white;
            font-weight: bold;
            font-size: 1.1rem;
            padding: 12px 22px;
            border-radius: 40px;
            cursor: pointer;
            box-shadow: 0 5px 0 #0f1a24, 0 6px 10px #00000060;
            transition: 0.08s linear;
            font-family: inherit;
            letter-spacing: 0.5px;
        }
        button:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #0f1a24, 0 6px 10px #00000060;
        }
        .mobile-pad {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 16px;
        }
        .dpad-row {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin: 4px 0;
        }
        .dpad-btn {
            width: 70px;
            height: 70px;
            font-size: 2rem;
            background: #2e4b66;
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 0 #0f1a24, 0 6px 12px #00000070;
            color: white;
            font-weight: bold;
            user-select: none;
            cursor: pointer;
            touch-action: manipulation;
            transition: 0.06s linear;
        }
        .dpad-btn:active {
            transform: translateY(5px);
            box-shadow: 0 1px 0 #0f1a24, 0 6px 12px #00000070;
        }
        .hidden { display: none !important; }
        #messageBox {
            margin-top: 12px;
            background: #00000080;
            border-radius: 40px;
            padding: 10px 24px;
            color: #ffe484;
            font-size: 1.25rem;
            font-weight: bold;
            text-align: center;
            min-height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
            box-shadow: inset 0 2px 8px #00000080;
        }
        .high-score {
            font-size: 0.9rem;
            color: #9fc5e8;
            margin-left: 12px;
        }
    </style>
</head>
<body>
<div class="game-wrapper">
    <canvas id="gameCanvas" width="600" height="600"></canvas>

    <div class="info-panel">
        <div class="stats">
            <div class="stat">❤️ <span id="livesDisplay">3</span></div>
            <div class="stat">🪙 <span id="coinsDisplay">0</span></div>
            <div class="stat">🔑 <span id="keysDisplay">0</span></div>
            <div class="stat">⏱️ <span id="timerDisplay">0</span>s</div>
        </div>
        <div class="controls">
            <button id="pauseBtn">⏸️ Pause</button>
            <button id="restartBtn">↻ Restart</button>
        </div>
    </div>

    <div id="messageBox">Use arrow keys or WASD</div>

    <div class="mobile-pad">
        <div class="dpad-row">
            <div class="dpad-btn" data-dir="up">▲</div>
        </div>
        <div class="dpad-row">
            <div class="dpad-btn" data-dir="left">◀</div>
            <div class="dpad-btn" data-dir="down">▼</div>
            <div class="dpad-btn" data-dir="right">▶</div>
        </div>
    </div>
</div>

<script>
    (function() {
        // ---------- ENHANCED CONSTANTS ----------
        const COLS = 15;
        const ROWS = 15;
        const TILE_SIZE = 600 / COLS;

        const TILE_WALL = 1;
        const TILE_FLOOR = 0;
        const TILE_COIN = 2;
        const TILE_KEY = 3;
        const TILE_DOOR = 4;
        const TILE_POWERUP = 5;
        const TILE_TRAP = 6;      // NEW: spike trap
        const TILE_TREASURE = 7;  // NEW: big score bonus

        // ---------- GAME STATE ----------
        let gameState = {
            maze: [],
            player: { x: 1, y: 1 },
            enemies: [],
            coins: 0,
            keys: 0,
            lives: 3,
            timer: 0,
            score: 0,
            level: 1,
            door: { x: -1, y: -1 },
            gameOver: false,
            win: false,
            paused: false,
            powerUpActive: false,
            shieldTimer: 0,
            trapsTriggered: 0,
            highScore: 0,
        };

        let timerInterval = null;
        let enemiesInterval = null;
        let enemyMoveCounter = 0;

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const livesDisplay = document.getElementById('livesDisplay');
        const coinsDisplay = document.getElementById('coinsDisplay');
        const keysDisplay = document.getElementById('keysDisplay');
        const timerDisplay = document.getElementById('timerDisplay');
        const pauseBtn = document.getElementById('pauseBtn');
        const restartBtn = document.getElementById('restartBtn');
        const messageBox = document.getElementById('messageBox');

        // ---------- ENHANCED MAZE GENERATION ----------
        function generateMaze(level = 1) {
            const maze = Array(ROWS).fill().map(() => Array(COLS).fill(TILE_WALL));
            const stack = [];
            const startX = 1, startY = 1;
            maze[startY][startX] = TILE_FLOOR;
            stack.push({ x: startX, y: startY });

            const dirs = [
                { dx: 0, dy: -2 }, { dx: 0, dy: 2 },
                { dx: -2, dy: 0 }, { dx: 2, dy: 0 }
            ];

            while (stack.length) {
                const current = stack[stack.length - 1];
                const { x, y } = current;
                const neighbors = [];
                for (const d of dirs) {
                    const nx = x + d.dx;
                    const ny = y + d.dy;
                    if (nx > 0 && nx < COLS-1 && ny > 0 && ny < ROWS-1 && maze[ny][nx] === TILE_WALL) {
                        neighbors.push({ x: nx, y: ny, dx: d.dx, dy: d.dy });
                    }
                }
                if (neighbors.length) {
                    const chosen = neighbors[Math.floor(Math.random() * neighbors.length)];
                    const wallX = x + chosen.dx / 2;
                    const wallY = y + chosen.dy / 2;
                    maze[wallY][wallX] = TILE_FLOOR;
                    maze[chosen.y][chosen.x] = TILE_FLOOR;
                    stack.push({ x: chosen.x, y: chosen.y });
                } else {
                    stack.pop();
                }
            }

            // exit door
            let doorX = COLS - 2, doorY = ROWS - 2;
            if (maze[doorY][doorX] === TILE_WALL) {
                outer: for (let y = ROWS-2; y >= 1; y--) {
                    for (let x = COLS-2; x >= 1; x--) {
                        if (maze[y][x] === TILE_FLOOR) {
                            doorX = x; doorY = y;
                            break outer;
                        }
                    }
                }
            }
            maze[doorY][doorX] = TILE_DOOR;

            // gather floor positions
            const floors = [];
            for (let y = 1; y < ROWS-1; y++) {
                for (let x = 1; x < COLS-1; x++) {
                    if (maze[y][x] === TILE_FLOOR && !(x === 1 && y === 1) && !(x === doorX && y === doorY)) {
                        floors.push({ x, y });
                    }
                }
            }
            // shuffle
            for (let i = floors.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [floors[i], floors[j]] = [floors[j], floors[i]];
            }

            let idx = 0;
            // Coins (more with level)
            const coinCount = Math.min(12, 4 + level * 2);
            for (let i = 0; i < coinCount && idx < floors.length; i++, idx++) {
                const { x, y } = floors[idx];
                maze[y][x] = TILE_COIN;
            }
            // Keys (1 + level/3, max 3)
            const keyCount = Math.min(3, 1 + Math.floor(level / 3));
            for (let i = 0; i < keyCount && idx < floors.length; i++, idx++) {
                const { x, y } = floors[idx];
                maze[y][x] = TILE_KEY;
            }
            // Powerup (25% + level*5% chance)
            if (idx < floors.length && Math.random() < 0.25 + level * 0.05) {
                const { x, y } = floors[idx];
                maze[y][x] = TILE_POWERUP;
                idx++;
            }
            // Traps (level 2+)
            if (level >= 2) {
                const trapCount = Math.min(5, 1 + Math.floor(level / 2));
                for (let i = 0; i < trapCount && idx < floors.length; i++, idx++) {
                    const { x, y } = floors[idx];
                    maze[y][x] = TILE_TRAP;
                }
            }
            // Treasure (level 3+)
            if (level >= 3 && idx < floors.length) {
                const { x, y } = floors[idx];
                maze[y][x] = TILE_TREASURE;
                idx++;
            }

            return { maze, doorX, doorY };
        }

        // ---------- INIT LEVEL ----------
        function initLevel(keepLives = false) {
            if (enemiesInterval) clearInterval(enemiesInterval);
            if (timerInterval) clearInterval(timerInterval);

            const level = gameState.level;
            const { maze, doorX, doorY } = generateMaze(level);

            gameState.maze = maze;
            gameState.player = { x: 1, y: 1 };
            gameState.coins = 0;
            gameState.keys = 0;
            if (!keepLives) gameState.lives = 3;
            gameState.timer = 0;
            gameState.score = 0;
            gameState.gameOver = false;
            gameState.win = false;
            gameState.paused = false;
            gameState.powerUpActive = false;
            gameState.shieldTimer = 0;
            gameState.trapsTriggered = 0;
            gameState.door = { x: doorX, y: doorY };
            enemyMoveCounter = 0;

            // load high score
            try {
                gameState.highScore = parseInt(localStorage.getItem('mazeHighScore') || 0);
            } catch (e) { gameState.highScore = 0; }

            // enemies: 1 + floor(level/2), max 5
            const enemyCount = Math.min(5, 1 + Math.floor(level / 2));
            gameState.enemies = [];
            const floorTiles = [];
            for (let y = 1; y < ROWS-1; y++) {
                for (let x = 1; x < COLS-1; x++) {
                    if (maze[y][x] === TILE_FLOOR && !(x === 1 && y === 1) && !(x === doorX && y === doorY)) {
                        floorTiles.push({ x, y });
                    }
                }
            }
            for (let i = 0; i < enemyCount; i++) {
                if (floorTiles.length === 0) break;
                const idx = Math.floor(Math.random() * floorTiles.length);
                const pos = floorTiles.splice(idx, 1)[0];
                gameState.enemies.push({ x: pos.x, y: pos.y });
            }

            updateUI();
            messageBox.textContent = `Level ${level} — find the 🔑 and open the door!`;

            timerInterval = setInterval(() => {
                if (!gameState.paused && !gameState.gameOver && !gameState.win) {
                    gameState.timer++;
                    timerDisplay.textContent = gameState.timer;
                    if (gameState.timer > 150) {
                        loseLife();
                    }
                    if (gameState.powerUpActive) {
                        gameState.shieldTimer--;
                        if (gameState.shieldTimer <= 0) {
                            gameState.powerUpActive = false;
                        }
                    }
                }
            }, 1000);

            enemiesInterval = setInterval(() => {
                if (gameState.paused || gameState.gameOver || gameState.win) return;
                enemyMoveCounter++;
                moveEnemies();
            }, 550);

            drawGame();
        }

        // ---------- UTILS ----------
        function isWalkable(x, y) {
            if (x < 0 || x >= COLS || y < 0 || y >= ROWS) return false;
            const tile = gameState.maze[y][x];
            return tile !== TILE_WALL;
        }

        function loseLife() {
            if (gameState.gameOver || gameState.win) return;
            gameState.lives--;
            updateUI();

            if (gameState.lives <= 0) {
                gameState.gameOver = true;
                if (enemiesInterval) clearInterval(enemiesInterval);
                if (timerInterval) clearInterval(timerInterval);
                messageBox.textContent = '💀 GAME OVER — press RESTART';
                saveHighScore();
                drawGame();
            } else {
                gameState.player = { x: 1, y: 1 };
                gameState.powerUpActive = false;
                gameState.shieldTimer = 0;
                messageBox.textContent = `Lost a life! ❤️ ${gameState.lives} left`;
                drawGame();
            }
        }

        function saveHighScore() {
            try {
                if (gameState.score > gameState.highScore) {
                    gameState.highScore = gameState.score;
                    localStorage.setItem('mazeHighScore', gameState.score);
                }
            } catch (e) {}
        }

        // ---------- ENHANCED ENEMY AI ----------
        function moveEnemies() {
            if (gameState.gameOver || gameState.win || gameState.paused) return;
            const player = gameState.player;

            for (const enemy of gameState.enemies) {
                const dx = player.x - enemy.x;
                const dy = player.y - enemy.y;
                const dist = Math.abs(dx) + Math.abs(dy);
                if (dist === 0) continue;

                // smarter chase: prioritize axis with larger diff, but also try alternate
                const moves = [];
                if (Math.abs(dx) > Math.abs(dy)) {
                    if (dx > 0) moves.push({ dx: 1, dy: 0 });
                    else if (dx < 0) moves.push({ dx: -1, dy: 0 });
                    if (dy > 0) moves.push({ dx: 0, dy: 1 });
                    else if (dy < 0) moves.push({ dx: 0, dy: -1 });
                } else {
                    if (dy > 0) moves.push({ dx: 0, dy: 1 });
                    else if (dy < 0) moves.push({ dx: 0, dy: -1 });
                    if (dx > 0) moves.push({ dx: 1, dy: 0 });
                    else if (dx < 0) moves.push({ dx: -1, dy: 0 });
                }
                // add random fallback moves (increases difficulty variety)
                moves.push({ dx: 0, dy: 1 }, { dx: 0, dy: -1 }, { dx: 1, dy: 0 }, { dx: -1, dy: 0 });

                let moved = false;
                for (const m of moves) {
                    const nx = enemy.x + m.dx;
                    const ny = enemy.y + m.dy;
                    if (isWalkable(nx, ny) && gameState.maze[ny][nx] !== TILE_DOOR) {
                        let occupied = gameState.enemies.some(e => e !== enemy && e.x === nx && e.y === ny);
                        if (!occupied) {
                            enemy.x = nx;
                            enemy.y = ny;
                            moved = true;
                            break;
                        }
                    }
                }
                // small chance to stay put (adds unpredictability)
                if (!moved && Math.random() < 0.2) {
                    // stay
                }
            }
            checkEnemyCollision();
            drawGame();
        }

        function checkEnemyCollision() {
            if (gameState.powerUpActive) {
                gameState.enemies = gameState.enemies.filter(enemy => {
                    if (enemy.x === gameState.player.x && enemy.y === gameState.player.y) {
                        gameState.score += 30;
                        return false;
                    }
                    return true;
                });
                updateUI();
                return;
            }
            for (const enemy of gameState.enemies) {
                if (enemy.x === gameState.player.x && enemy.y === gameState.player.y) {
                    loseLife();
                    break;
                }
            }
        }

        // ---------- PLAYER MOVEMENT WITH TRAPS & TREASURE ----------
        function movePlayer(dx, dy) {
            if (gameState.gameOver || gameState.win || gameState.paused) return;
            const newX = gameState.player.x + dx;
            const newY = gameState.player.y + dy;

            if (!isWalkable(newX, newY)) return;

            const tile = gameState.maze[newY][newX];

            if (tile === TILE_WALL) return;

            if (tile === TILE_DOOR) {
                if (gameState.keys > 0) {
                    gameState.maze[newY][newX] = TILE_FLOOR;
                    gameState.keys--;
                    updateUI();
                    messageBox.textContent = 'Door opened!';
                    gameState.player.x = newX;
                    gameState.player.y = newY;
                    drawGame();
                    checkWinCondition();
                } else {
                    messageBox.textContent = '🔒 Need a key!';
                }
                return;
            }

            // handle trap BEFORE moving
            if (tile === TILE_TRAP) {
                gameState.trapsTriggered++;
                if (gameState.powerUpActive) {
                    gameState.maze[newY][newX] = TILE_FLOOR; // destroyed by shield
                    messageBox.textContent = '🛡️ Trap destroyed!';
                } else {
                    gameState.maze[newY][newX] = TILE_FLOOR;
                    loseLife();
                    if (gameState.gameOver || gameState.lives <= 0) return;
                }
                // still move onto the trap tile (now floor)
            }

            // move player
            gameState.player.x = newX;
            gameState.player.y = newY;

            // collect items
            if (tile === TILE_COIN) {
                gameState.coins++;
                gameState.score += 15;
                gameState.maze[newY][newX] = TILE_FLOOR;
            } else if (tile === TILE_KEY) {
                gameState.keys++;
                gameState.score += 35;
                gameState.maze[newY][newX] = TILE_FLOOR;
                messageBox.textContent = `🔑 Key collected! (${gameState.keys})`;
            } else if (tile === TILE_POWERUP) {
                gameState.powerUpActive = true;
                gameState.shieldTimer = 12;
                gameState.score += 40;
                gameState.maze[newY][newX] = TILE_FLOOR;
                messageBox.textContent = '🛡️ Shield active!';
            } else if (tile === TILE_TREASURE) {
                gameState.score += 150;
                gameState.maze[newY][newX] = TILE_FLOOR;
                messageBox.textContent = '💎 Treasure! +150 points!';
            }

            updateUI();
            drawGame();
            checkWinCondition();
            checkEnemyCollision();
        }

        function checkWinCondition() {
            if (gameState.player.x === gameState.door.x && gameState.player.y === gameState.door.y) {
                if (gameState.maze[gameState.door.y][gameState.door.x] === TILE_FLOOR) {
                    gameState.win = true;
                    gameState.score += 200 + gameState.timer * 3;
                    if (enemiesInterval) clearInterval(enemiesInterval);
                    if (timerInterval) clearInterval(timerInterval);
                    messageBox.textContent = `🏆 LEVEL COMPLETE! Score: ${gameState.score}`;
                    saveHighScore();
                    drawGame();
                    setTimeout(() => {
                        gameState.level++;
                        initLevel(true);
                    }, 1600);
                }
            }
        }

        // ---------- ENHANCED DRAWING ----------
        function drawGame() {
            ctx.clearRect(0, 0, 600, 600);

            for (let y = 0; y < ROWS; y++) {
                for (let x = 0; x < COLS; x++) {
                    const tile = gameState.maze[y][x];
                    const px = x * TILE_SIZE;
                    const py = y * TILE_SIZE;

                    if (tile === TILE_WALL) {
                        // 3D-ish wall
                        ctx.fillStyle = '#2a4055';
                        ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);
                        ctx.fillStyle = '#1d3040';
                        ctx.fillRect(px+3, py+3, TILE_SIZE-6, TILE_SIZE-6);
                        ctx.fillStyle = '#3b5a7a';
                        ctx.fillRect(px+1, py+1, TILE_SIZE-2, 3);
                    } else {
                        // floor with subtle grid
                        ctx.fillStyle = '#162b3b';
                        ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);
                        ctx.fillStyle = '#1e3a4e';
                        ctx.fillRect(px+2, py+2, TILE_SIZE-4, TILE_SIZE-4);
                        ctx.strokeStyle = '#2a4d66';
                        ctx.lineWidth = 1;
                        ctx.strokeRect(px+0.5, py+0.5, TILE_SIZE-1, TILE_SIZE-1);
                    }

                    // items with slight glow
                    if (tile === TILE_COIN) {
                        ctx.shadowColor = '#f5d742';
                        ctx.shadowBlur = 12;
                        ctx.font = `${TILE_SIZE*0.65}px "Segoe UI", Arial`;
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillStyle = '#ffdd44';
                        ctx.fillText('🪙', px + TILE_SIZE/2, py + TILE_SIZE/2);
                        ctx.shadowBlur = 0;
                    } else if (tile === TILE_KEY) {
                        ctx.shadowColor = '#b8b8ff';
                        ctx.shadowBlur = 15;
                        ctx.font = `${TILE_SIZE*0.65}px "Segoe UI", Arial`;
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillStyle = '#d0d0ff';
                        ctx.fillText('🔑', px + TILE_SIZE/2, py + TILE_SIZE/2);
                        ctx.shadowBlur = 0;
                    } else if (tile === TILE_DOOR) {
                        ctx.shadowColor = '#b07c4b';
                        ctx.shadowBlur = 16;
                        ctx.font = `${TILE_SIZE*0.75}px "Segoe UI", Arial`;
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillStyle = '#c68b5a';
                        ctx.fillText('🚪', px + TILE_SIZE/2, py + TILE_SIZE/2);
                        ctx.shadowBlur = 0;
                    } else if (tile === TILE_POWERUP) {
                        ctx.shadowColor = '#7cfc00';
                        ctx.shadowBlur = 18;
                        ctx.font = `${TILE_SIZE*0.65}px "Segoe UI", Arial`;
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillStyle = '#aaff88';
                        ctx.fillText('🛡️', px + TILE_SIZE/2, py + TILE_SIZE/2);
                        ctx.shadowBlur = 0;
                    } else if (tile === TILE_TRAP) {
                        ctx.font = `${TILE_SIZE*0.7}px "Segoe UI", Arial`;
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillStyle = '#ff5555';
                        ctx.fillText('⚡', px + TILE_SIZE/2, py + TILE_SIZE/2);
                    } else if (tile === TILE_TREASURE) {
                        ctx.shadowColor = '#ffaa00';
                        ctx.shadowBlur = 20;
                        ctx.font = `${TILE_SIZE*0.7}px "Segoe UI", Arial`;
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillStyle = '#ffcc44';
                        ctx.fillText('💎', px + TILE_SIZE/2, py + TILE_SIZE/2);
                        ctx.shadowBlur = 0;
                    }
                }
            }

            // enemies with glow
            for (const enemy of gameState.enemies) {
                ctx.shadowColor = '#ff5e5e';
                ctx.shadowBlur = 18;
                ctx.font = `${TILE_SIZE*0.75}px "Segoe UI", Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = '#ff7777';
                ctx.fillText('👾', enemy.x * TILE_SIZE + TILE_SIZE/2, enemy.y * TILE_SIZE + TILE_SIZE/2);
                ctx.shadowBlur = 0;
            }

            // player with glow
            ctx.shadowColor = '#ffffff';
            ctx.shadowBlur = 15;
            ctx.font = `${TILE_SIZE*0.75}px "Segoe UI", Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = '#ffffff';
            ctx.fillText('🧙', gameState.player.x * TILE_SIZE + TILE_SIZE/2, gameState.player.y * TILE_SIZE + TILE_SIZE/2);
            ctx.shadowBlur = 0;

            // shield aura
            if (gameState.powerUpActive) {
                ctx.strokeStyle = '#7cfc00';
                ctx.lineWidth = 5;
                ctx.shadowColor = '#7cfc00';
                ctx.shadowBlur = 20;
                ctx.beginPath();
                ctx.arc(gameState.player.x * TILE_SIZE + TILE_SIZE/2, gameState.player.y * TILE_SIZE + TILE_SIZE/2, TILE_SIZE*0.65, 0, 2*Math.PI);
                ctx.stroke();
                ctx.shadowBlur = 0;
            }

            // overlays
            if (gameState.gameOver) {
                ctx.fillStyle = '#000000cc';
                ctx.fillRect(0, 0, 600, 600);
                ctx.fillStyle = '#ff8888';
                ctx.font = 'bold 52px "Segoe UI", "Courier New", monospace';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('GAME OVER', 300, 280);
                ctx.font = '24px "Segoe UI", monospace';
                ctx.fillStyle = '#dddddd';
                ctx.fillText(`Score: ${gameState.score}`, 300, 360);
                ctx.fillText(`High: ${gameState.highScore}`, 300, 400);
            } else if (gameState.win) {
                ctx.fillStyle = '#00000099';
                ctx.fillRect(0, 0, 600, 600);
                ctx.fillStyle = '#aaffaa';
                ctx.font = 'bold 52px "Segoe UI", "Courier New", monospace';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('LEVEL CLEAR!', 300, 280);
                ctx.font = '28px "Segoe UI", monospace';
                ctx.fillStyle = '#ffffaa';
                ctx.fillText(`+${200 + gameState.timer * 3} bonus`, 300, 360);
            } else if (gameState.paused) {
                ctx.fillStyle = '#000000aa';
                ctx.fillRect(0, 0, 600, 600);
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 52px "Segoe UI", "Courier New", monospace';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('PAUSED', 300, 300);
            }
        }

        // ---------- UI UPDATE ----------
        function updateUI() {
            livesDisplay.textContent = gameState.lives;
            coinsDisplay.textContent = gameState.coins;
            keysDisplay.textContent = gameState.keys;
            timerDisplay.textContent = gameState.timer;
        }

        // ---------- EVENT HANDLERS ----------
        function handleKeyDown(e) {
            const key = e.key;
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'w', 'a', 's', 'd', 'W', 'A', 'S', 'D'].includes(key)) {
                e.preventDefault();
            }
            if (gameState.gameOver || gameState.win || gameState.paused) return;

            if (key === 'ArrowUp' || key === 'w' || key === 'W') movePlayer(0, -1);
            else if (key === 'ArrowDown' || key === 's' || key === 'S') movePlayer(0, 1);
            else if (key === 'ArrowLeft' || key === 'a' || key === 'A') movePlayer(-1, 0);
            else if (key === 'ArrowRight' || key === 'd' || key === 'D') movePlayer(1, 0);
        }

        function setupMobileControls() {
            document.querySelectorAll('.dpad-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.preventDefault();
                    if (gameState.gameOver || gameState.win || gameState.paused) return;
                    const dir = btn.dataset.dir;
                    if (dir === 'up') movePlayer(0, -1);
                    else if (dir === 'down') movePlayer(0, 1);
                    else if (dir === 'left') movePlayer(-1, 0);
                    else if (dir === 'right') movePlayer(1, 0);
                });
                btn.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    if (gameState.gameOver || gameState.win || gameState.paused) return;
                    const dir = btn.dataset.dir;
                    if (dir === 'up') movePlayer(0, -1);
                    else if (dir === 'down') movePlayer(0, 1);
                    else if (dir === 'left') movePlayer(-1, 0);
                    else if (dir === 'right') movePlayer(1, 0);
                }, { passive: false });
            });
        }

        function togglePause() {
            if (gameState.gameOver || gameState.win) return;
            gameState.paused = !gameState.paused;
            pauseBtn.textContent = gameState.paused ? '▶️ Resume' : '⏸️ Pause';
            messageBox.textContent = gameState.paused ? 'PAUSED' : `Level ${gameState.level} — keep going!`;
            drawGame();
        }

        function restartGame() {
            if (enemiesInterval) clearInterval(enemiesInterval);
            if (timerInterval) clearInterval(timerInterval);
            gameState.level = 1;
            gameState.lives = 3;
            gameState.score = 0;
            gameState.paused = false;
            pauseBtn.textContent = '⏸️ Pause';
            initLevel(false);
        }

        // ---------- START ----------
        function startGame() {
            if (enemiesInterval) clearInterval(enemiesInterval);
            if (timerInterval) clearInterval(timerInterval);

            gameState.level = 1;
            gameState.lives = 3;
            gameState.score = 0;
            gameState.paused = false;
            gameState.gameOver = false;
            gameState.win = false;
            pauseBtn.textContent = '⏸️ Pause';

            initLevel(false);
            setupMobileControls();

            window.removeEventListener('keydown', handleKeyDown);
            window.addEventListener('keydown', handleKeyDown);

            pauseBtn.onclick = togglePause;
            restartBtn.onclick = restartGame;

            drawGame();
        }

        startGame();
    })();
</script>
</body>
</html>
