
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Escape</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    background: #090914;
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.game-container {
    text-align: center;
    width: 95%;
    max-width: 480px;
    padding: 20px;
    border-radius: 20px;
    background: #151526;
    box-shadow: 0 0 30px #8b5cf633;
}

h1 {
    color: #a855f7;
    text-shadow: 0 0 15px #a855f7;
    letter-spacing: 3px;
}

.stats {
    display: flex;
    justify-content: space-around;
    font-size: 18px;
    margin: 15px 0;
}

canvas {
    width: 100%;
    max-width: 400px;
    background: #080812;
    border: 2px solid #a855f7;
    border-radius: 12px;
    display: block;
    margin: auto;
}

button {
    background: #a855f7;
    border: none;
    color: white;
    padding: 12px 22px;
    margin: 10px 5px;
    border-radius: 10px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #c084fc;
}

.controls button {
    font-size: 22px;
    min-width: 65px;
}

p { color: #aaa; }
</style>
</head>

<body>

<div class="game-container">
    <h1>NEON ESCAPE</h1>

    <div class="stats">
        <div>⭐ Score: <span id="score">0</span></div>
        <div>🪙 Coins: <span id="coins">0</span></div>
    </div>

    <canvas id="game" width="400" height="550"></canvas>

    <button onclick="startGame()">▶ START / RESTART</button>

    <div class="controls">
        <button onclick="moveLeft()">⬅</button>
        <button onclick="moveRight()">➡</button>
    </div>

    <p>Dodge the red blocks and collect the gold!</p>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let player, obstacles, coinList, score, coins, speed;
let running = false;
let animation;
let lastTime = 0;
let spawnTimer = 0;
let coinTimer = 0;

function startGame() {
    cancelAnimationFrame(animation);

    player = { x: 180, y: 480, width: 40, height: 40 };
    obstacles = [];
    coinList = [];
    score = 0;
    coins = 0;
    speed = 3;
    spawnTimer = 0;
    coinTimer = 0;
    lastTime = 0;
    running = true;

    document.getElementById("score").textContent = score;
    document.getElementById("coins").textContent = coins;

    animation = requestAnimationFrame(loop);
}

function moveLeft() {
    if (running) player.x -= 40;
    player.x = Math.max(0, player.x);
}

function moveRight() {
    if (running) player.x += 40;
    player.x = Math.min(360, player.x);
}

document.addEventListener("keydown", e => {
    if (["ArrowLeft", "ArrowRight", "a", "d", "A", "D"].includes(e.key))
        e.preventDefault();

    if (!running) return;

    if (e.key === "ArrowLeft" || e.key.toLowerCase() === "a")
        moveLeft();

    if (e.key === "ArrowRight" || e.key.toLowerCase() === "d")
        moveRight();
});

function spawnObstacle() {
    let x = Math.floor(Math.random() * 10) * 40;
    obstacles.push({ x, y: -40, width: 40, height: 40 });
}

function spawnCoin() {
    let x = Math.floor(Math.random() * 10) * 40;
    coinList.push({ x: x + 10, y: -20, radius: 10 });
}

function collision(a, b) {
    return a.x < b.x + b.width &&
           a.x + a.width > b.x &&
           a.y < b.y + b.height &&
           a.y + a.height > b.y;
}

function loop(timestamp) {
    if (!running) return;

    let delta = lastTime ? Math.min((timestamp - lastTime) / 16.67, 3) : 1;
    lastTime = timestamp;

    update(delta);
    draw();

    if (running)
        animation = requestAnimationFrame(loop);
}

function update(delta) {
    spawnTimer += delta;
    coinTimer += delta;

    speed = 3 + score * 0.04;

    if (spawnTimer > Math.max(20, 55 - score * 0.3)) {
        spawnObstacle();
        spawnTimer = 0;
    }

    if (coinTimer > 90) {
        spawnCoin();
        coinTimer = 0;
    }

    obstacles.forEach(o => o.y += speed * delta);
    coinList.forEach(c => c.y += speed * delta);

    obstacles = obstacles.filter(o => o.y < 560);
    coinList = coinList.filter(c => c.y < 560);

    // Obstacle collision
    for (let o of obstacles) {
        if (collision(player, o)) {
            endGame();
            return;
        }
    }

    // Coin collection
    coinList = coinList.filter(c => {
        let hit = player.x < c.x + 20 &&
                  player.x + player.width > c.x - 10 &&
                  player.y < c.y + 20 &&
                  player.y + player.height > c.y - 10;

        if (hit) {
            coins++;
            score += 10;
            document.getElementById("coins").textContent = coins;
        }
        return !hit;
    });

    score++;
    document.getElementById("score").textContent = score;
}

function draw() {
    ctx.clearRect(0, 0, 400, 550);

    // Background
    ctx.fillStyle = "#080812";
    ctx.fillRect(0, 0, 400, 550);

    // Grid
    ctx.strokeStyle = "#17172d";
    ctx.lineWidth = 1;

    for (let x = 0; x <= 400; x += 40) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, 550);
        ctx.stroke();
    }

    for (let y = 0; y <= 550; y += 40) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(400, y);
        ctx.stroke();
    }

    // Player
    ctx.shadowBlur = 20;
    ctx.shadowColor = "#00f7ff";
    ctx.fillStyle = "#00f7ff";
    ctx.fillRect(player.x, player.y, player.width, player.height);
    ctx.shadowBlur = 0;

    // Obstacles
    obstacles.forEach(o => {
        ctx.shadowColor = "#ff1744";
        ctx.shadowBlur = 15;
        ctx.fillStyle = "#ff1744";
        ctx.fillRect(o.x, o.y, o.width, o.height);
    });

    ctx.shadowBlur = 0;

    // Coins
    coinList.forEach(c => {
        ctx.shadowColor = "#ffd700";
        ctx.shadowBlur = 15;
        ctx.fillStyle = "#ffd700";
        ctx.beginPath();
        ctx.arc(c.x, c.y, c.radius, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#fff3a0";
        ctx.beginPath();
        ctx.arc(c.x, c.y, 4, 0, Math.PI * 2);
        ctx.fill();
    });

    ctx.shadowBlur = 0;
}

function endGame() {
    running = false;
    cancelAnimationFrame(animation);

    draw();

    ctx.fillStyle = "rgba(0,0,0,0.75)";
    ctx.fillRect(0, 0, 400, 550);

    ctx.textAlign = "center";

    ctx.shadowColor = "#ff1744";
    ctx.shadowBlur = 20;
    ctx.fillStyle = "#ff1744";
    ctx.font = "bold 38px Arial";
    ctx.fillText("GAME OVER", 200, 235);

    ctx.shadowBlur = 0;
    ctx.fillStyle = "white";
    ctx.font = "22px Arial";
    ctx.fillText("Score: " + score, 200, 285);
    ctx.fillText("Coins: " + coins, 200, 325);

    ctx.fillStyle = "#a855f7";
    ctx.font = "18px Arial";
    ctx.fillText("Press RESTART to play again!", 200, 380);
}

drawStartScreen();

function drawStartScreen() {
    ctx.fillStyle = "#080812";
    ctx.fillRect(0, 0, 400, 550);

    ctx.textAlign = "center";
    ctx.fillStyle = "#a855f7";
    ctx.font = "bold 30px Arial";
    ctx.fillText("READY TO ESCAPE?", 200, 230);

    ctx.fillStyle = "white";
    ctx.font = "18px Arial";
    ctx.fillText("Dodge blocks!", 200, 285);
    ctx.fillText("Collect coins!", 200, 320);
    ctx.fillText("Press START", 200, 380);
}
</script>

</body>
</html>
